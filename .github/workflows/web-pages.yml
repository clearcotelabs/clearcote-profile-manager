name: Web profile manager (GitHub Pages)

# Builds the web version of the profile manager (the same UI as the desktop app, talking to the
# Clearcote Helper on the person's computer) from this repo and publishes it on GitHub Pages.
# The live page is always a build of a commit on main, by this public workflow.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The helper-v* tags: next.config.mjs bakes the newest one into the download button.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the web version (static export to out/)
        run: npm run web:build

      # GitHub Pages runs Jekyll by default, which drops the _next/ folder (leading underscore).
      - run: touch out/.nojekyll

      # Custom domain: set app.clearcotelabs.com in the repo's Settings → Pages, and ship a CNAME file
      # with the build so a deploy never clears it. The helper already allows that origin (helper/auth.ts).
      # - run: echo "app.clearcotelabs.com" > out/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
