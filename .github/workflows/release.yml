name: Release

# Build the app entirely on GitHub's runners (no local machine) for Windows, Linux and macOS,
# publish a single GitHub Release, and attach a build-provenance attestation + SHA-256 checksums
# so anyone can prove the downloaded artifact came from this repo's CI at this commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create the release + upload assets
  id-token: write # OIDC for the provenance attestation (Sigstore)
  attestations: write # store the attestation

jobs:
  build:
    # Each OS packages natively — no cross-building, no Docker, no Wine. All three are built on every
    # release; a release missing a platform is never a thing that can happen by accident.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            # Installer + portable zip.
            artifacts: |
              release/*.exe
              release/*.zip
          - os: ubuntu-latest
            name: linux
            # AppImage (run it anywhere) + tarball (unpack and run).
            artifacts: |
              release/*.AppImage
              release/*.tar.gz
          - os: macos-latest
            name: macos
            # One disk image per CPU (Apple Silicon, Intel), ad-hoc signed by scripts/mac-adhoc-sign.cjs.
            # No macOS zip: copies of the app from before macOS existed update to "the first .zip" in
            # the release, which must stay the Windows portable one.
            artifacts: |
              release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package (electron-builder)
        run: npm run dist
        env:
          # Unsigned build — the provenance attestation + checksums are the integrity proof.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The tag is "v0.12.0" but every artifact is named "0.12.0" — pasting the tag into the
      # verify commands below hands people a filename that does not exist.
      - name: Resolve the bare version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download every platform's artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: release

      - name: Generate SHA256SUMS
        run: |
          cd release
          ls -la
          shopt -s nullglob
          files=(*.exe *.zip *.AppImage *.tar.gz *.dmg)
          if [ ${#files[@]} -eq 0 ]; then echo "No artifacts found in release/" >&2; exit 1; fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Clearcote Profile Manager ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg
            release/SHA256SUMS.txt
          body: |
            **Clearcote Profile Manager** — a desktop app to create, save, organize, and launch
            [Clearcote](https://github.com/clearcotelabs/clearcote-browser) browser identities.

            ## Download

            **Windows (x64)**
            - **Installer** — `Clearcote-Profile-Manager-*-setup.exe` · double-click to install.
            - **Portable** — `Clearcote-Profile-Manager-*-x64.zip` · unzip and run `Clearcote Profile Manager.exe` (no install).

            **Linux (x64)**
            - **AppImage** — `Clearcote-Profile-Manager-*-x86_64.AppImage` · `chmod +x` it and run; no install, no root.
            - **Tarball** — `Clearcote-Profile-Manager-*-x64.tar.gz` · unpack and run `clearcote-profile-manager`.

            **macOS**
            - **Apple Silicon** — `Clearcote-Profile-Manager-*-mac-arm64.dmg` · open it and drag the app to Applications.
            - **Intel** — `Clearcote-Profile-Manager-*-mac-x64.dmg` · same.
            - The Clearcote browser for macOS is a PRO build for Apple Silicon: add your licence key in Settings.
              On an Intel Mac, run profiles in the cloud or choose a browser binary.

            ## Built in the open — verify it yourself
            Every build was produced **entirely by GitHub Actions** — Windows on a `windows-latest`
            runner, Linux on `ubuntu-latest`, macOS on `macos-latest` — from this tagged commit, with no local machines. The
            workflow and full logs are public. Two independent ways to confirm nothing was tampered
            with:

            **1 · Provenance attestation** (proves it came from *this* repo's CI at *this* commit):
            ```
            gh attestation verify Clearcote-Profile-Manager-${{ env.VERSION }}-setup.exe -R ${{ github.repository }}
            gh attestation verify Clearcote-Profile-Manager-${{ env.VERSION }}-x86_64.AppImage -R ${{ github.repository }}
            gh attestation verify Clearcote-Profile-Manager-${{ env.VERSION }}-mac-arm64.dmg -R ${{ github.repository }}
            ```

            **2 · SHA-256 checksums** (`SHA256SUMS.txt`):
            ```
            # Linux
            sha256sum -c SHA256SUMS.txt --ignore-missing
            # macOS
            shasum -a 256 -c SHA256SUMS.txt --ignore-missing
            # Windows (PowerShell)
            (Get-FileHash .\Clearcote-Profile-Manager-${{ env.VERSION }}-setup.exe -Algorithm SHA256).Hash
            ```

            > **Unsigned build.** Windows SmartScreen may warn on first run — choose **More info → Run anyway**.
            > On macOS the app is ad-hoc signed but not notarized, so the first open is blocked: choose
            > **System Settings → Privacy & Security → Open Anyway**.
            > The app is not code-signed with a paid certificate (Authenticode or Apple Developer ID); the provenance
            > attestation + checksums above are the integrity guarantee instead.
