name: Test

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    # macOS too: the tests that unpack a real app bundle with ditto and resolve it run only there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
